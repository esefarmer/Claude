<style>
:root {
  --bg: #e9f4f2;
  --panel: #ffffff;
  --ink: #15323a;
  --sub: #4b6870;
  --line: #cfe2df;
  --accent: #0d8a8c;
  --accent-ink: #ffffff;
  --accent-soft: #d6efee;
  --hdr: #0b4a56;
  --coral: #e76f51;
  --ok: #23924a;
  --ok-soft: #dcf3e3;
  --ng: #cf3b3b;
  --ng-soft: #fbe2e0;
  --gold: #e9a91b;
  --shadow: 0 2px 10px rgba(11, 74, 86, .10);
  --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "BIZ UDPGothic", Meiryo, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 18%, rgba(13,138,140,.10) 0 90px, transparent 91px),
    radial-gradient(ellipse 140px 70px at 92% 30%, rgba(231,111,81,.08) 0 100%, transparent 100%),
    radial-gradient(circle at 85% 88%, rgba(233,169,27,.10) 0 120px, transparent 121px),
    radial-gradient(circle at 20% 92%, rgba(13,138,140,.07) 0 60px, transparent 61px),
    var(--bg);
  background-attachment: fixed;
  min-height: 100vh;
  line-height: 1.6;
  font-size: 16px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- header ---------- */
#hdr {
  background: var(--hdr); color: #fff;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 8px 18px; position: sticky; top: 0; z-index: 20;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
#hdr .logo { font-weight: 800; font-size: 20px; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; background: none; border: 0; color: #fff; padding: 4px 0; }
#hdr .logo .cell { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 60% 40%, #f4c55a 0 6px, #2fb6a8 7px 100%); border: 2px solid #bff0ea; }
#hdr .me { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 14px; }
#hdr .rank { background: var(--gold); color: #3a2a00; font-weight: 700; border-radius: 999px; padding: 2px 12px; }
#hdr .xpbar { width: 140px; height: 8px; background: rgba(255,255,255,.25); border-radius: 99px; overflow: hidden; }
#hdr .xpbar i { display: block; height: 100%; background: #9ff0d9; }
#hdr .hbtn { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 10px; padding: 4px 10px; color: #fff; font-size: 14px; }
#hdr .hbtn:hover { background: rgba(255,255,255,.22); }

main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
h1, h2, h3 { line-height: 1.35; margin: 0 0 8px; }
.panel { background: var(--panel); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 20px; border: 1px solid var(--line); }
.muted { color: var(--sub); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn.sub { background: #fff; color: var(--accent); border: 2px solid var(--accent); box-shadow: none; }
.btn.coral { background: var(--coral); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: default; }
.back { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 4px 0; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 10px; background: var(--accent-soft); color: var(--accent); }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 18px; white-space: nowrap; }
.stars .off { color: #cdd8d6; }

/* ---------- home ---------- */
.hero { display: flex; gap: 20px; align-items: center; margin-bottom: 18px; }
.hero h1 { font-size: 26px; }
.rooms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.room { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow); display: flex; gap: 16px; align-items: flex-start; transition: transform .12s, box-shadow .12s; }
.room:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(11,74,86,.16); }
.room .ic { font-size: 40px; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 16px; background: var(--accent-soft); flex: none; }
.room h3 { font-size: 20px; margin: 0; }
.room .kind { font-size: 13px; color: var(--accent); font-weight: 700; }
.room p { margin: 4px 0 8px; color: var(--sub); font-size: 14px; }
.room .prog { display: block; height: 8px; background: #e5efee; border-radius: 99px; overflow: hidden; }
.room .prog i { display: block; height: 100%; background: var(--accent); }
.room .pt { display: block; font-size: 13px; color: var(--sub); margin-top: 4px; }
.rooms.small { grid-template-columns: repeat(2, 1fr); margin-top: 16px; }
.rooms.small .room { padding: 12px 16px; align-items: center; }
.rooms.small .ic { width: 48px; height: 48px; font-size: 28px; background: #fff3d6; }

/* ---------- list of stages ---------- */
.stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; margin-top: 14px; }
.stage-card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.stage-card:hover { border-color: var(--accent); }
.stage-card .no { font-size: 12px; color: var(--sub); font-weight: 700; }
.stage-card h3 { font-size: 17px; margin: 0; }
.stage-card.clear { background: linear-gradient(0deg, #f3fbf7, #fff); }

/* ---------- molecule blocks ---------- */
.blk { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.shape { width: 66px; height: 66px; display: grid; place-items: center; background: var(--c); color: #1b1b1b; font-weight: 800; font-size: 17px; position: relative; }
.shape b { position: relative; z-index: 1; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
.sh-hex { clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
.sh-pent { clip-path: polygon(50% 2%, 98% 38%, 80% 96%, 20% 96%, 2% 38%); }
.sh-circ { border-radius: 50%; width: 52px; height: 52px; }
.sh-aa { border-radius: 50%; border: 4px solid rgba(0,0,0,.18); }
.sh-aa::after { content: ''; position: absolute; bottom: -10px; left: 50%; width: 10px; height: 14px; margin-left: -5px; background: var(--c); border-radius: 0 0 5px 5px; border: 3px solid rgba(0,0,0,.18); border-top: 0; }
.sh-base { border-radius: 8px 8px 22px 22px; width: 54px; height: 62px; color: #fff; text-shadow: none; }
.sh-base b { text-shadow: none; font-size: 24px; }
.sh-bar { width: 44px; height: 120px; border-radius: 10px; writing-mode: vertical-rl; font-size: 15px; letter-spacing: .1em; }
.sh-zig { width: 110px; height: 40px; border-radius: 20px 6px 6px 20px; background: repeating-linear-gradient(135deg, var(--c) 0 10px, color-mix(in srgb, var(--c) 82%, #000) 10px 12px); font-size: 14px; }
.blk small { font-size: 12px; color: var(--sub); font-weight: 700; white-space: nowrap; }
.blk .end { position: absolute; top: 22px; font-size: 13px; font-weight: 700; color: var(--coral); background: #fff; border-radius: 6px; padding: 0 3px; border: 1px solid #f3c7bb; z-index: 2; white-space: nowrap; }
.blk .end.l { right: calc(100% + 2px); }
.blk .end.r { left: calc(100% + 2px); }
.sh-zig + small, .sh-bar + small { margin-top: 0; }

.mol { display: inline-flex; align-items: center; flex-wrap: nowrap; }
.bond { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 28px; padding: 0 2px; position: relative; align-self: center; margin-top: -18px; }
.bond .bl { width: 100%; min-width: 24px; height: 6px; background: #3b5960; border-radius: 3px; }
.bond.hi .bl { background: repeating-linear-gradient(90deg, #3b5960 0 8px, #fff 8px 10px); height: 8px; }
.bond .bn { font-size: 11px; color: var(--sub); white-space: nowrap; margin-top: 2px; font-weight: 700; }
.bond .bf { font-size: 13px; color: var(--coral); white-space: nowrap; font-weight: 800; }
.gap { width: 26px; text-align: center; color: #9db6b3; font-weight: 800; font-size: 22px; margin-top: -18px; }

.slot { width: 70px; height: 70px; border: 3px dashed #9bc4c0; border-radius: 14px; display: grid; place-items: center; color: #7aa29e; font-weight: 700; font-size: 12px; text-align: center; background: rgba(255,255,255,.6); padding: 2px; line-height: 1.25; }
.slot.next { border-color: var(--coral); background: #fff4ef; animation: pulse 1.2s infinite; }
.slot.bar { width: 50px; height: 124px; }
.slot.zig { width: 112px; height: 44px; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(231,111,81,.18); } }

.bench { position: relative; background: #f6fbfa; border: 2px solid var(--line); border-radius: 16px; min-height: 200px; padding: 30px 20px 24px; display: flex; align-items: center; justify-content: center; overflow-x: auto; overflow-y: hidden; }
.bench .mol { padding: 0 40px; }
.fatmol { display: inline-flex; align-items: center; gap: 0; }
.fatmol .arms { display: flex; flex-direction: column; gap: 4px; }
.fatmol .arm { display: flex; align-items: center; min-height: 40px; }
.fatmol .arm .bond { margin-top: 0; }
.fatmol .arm .oh { font-size: 13px; color: var(--coral); font-weight: 800; padding: 0 6px; }
.fatmol .arm .blk small { display: none; }
.fatmol .bar-wrap { display: flex; flex-direction: column; align-items: center; }

.pairmol { display: inline-grid; grid-auto-flow: column; gap: 6px 10px; grid-template-rows: auto auto auto; align-items: center; justify-items: center; }
.pairmol .lab { font-size: 12px; font-weight: 700; color: var(--sub); writing-mode: horizontal-tb; white-space: nowrap; }
.hb { display: flex; gap: 5px; height: 26px; }
.hb i { width: 3px; height: 100%; background: repeating-linear-gradient(0deg, #3b5960 0 4px, transparent 4px 7px); }
.pairmol .blk small { display: none; }
.pairmol .top .shape { border-radius: 22px 22px 8px 8px; }

.palette { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px; }
.pc { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px 6px; min-width: 96px; display: flex; justify-content: center; }
.pc:hover { border-color: var(--accent); transform: translateY(-2px); }
.pc.shake { animation: shake .4s; border-color: var(--ng); }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.bubble { position: absolute; pointer-events: none; font-weight: 800; color: #0a6fb5; background: #dff1ff; border: 2px solid #8cc8f3; border-radius: 999px; padding: 2px 10px; font-size: 15px; animation: rise 1.6s ease-out forwards; z-index: 5; white-space: nowrap; }
.bubble.in { animation: drop 0.9s ease-in forwards; }
@keyframes rise { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1); } 100% { transform: translate(-50%, -80px); opacity: 0; } }
@keyframes drop { 0% { transform: translate(-50%, -70px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(-50%, 0); opacity: 0; } }
.popin { animation: popin .45s ease-out; }
@keyframes popin { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

.msg { min-height: 30px; margin-top: 12px; font-weight: 700; text-align: center; }
.msg.ok { color: var(--ok); }
.msg.ng { color: var(--ng); }
.toolbar { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin: 10px 0 0; flex-wrap: wrap; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--sub); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.switch[aria-pressed="true"] { border-color: var(--coral); color: var(--coral); background: #fff4ef; }

.goal { background: #fffaf0; border-left: 5px solid var(--gold); padding: 10px 14px; border-radius: 8px; margin: 10px 0 14px; }

/* ---------- quiz ---------- */
.qcard { max-width: 820px; margin: 0 auto; }
.qtext { font-size: 21px; font-weight: 700; margin: 10px 0 18px; }
.choices { display: grid; gap: 10px; }
.choices.ox { grid-template-columns: 1fr 1fr; }
.choice { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: 17px; display: flex; gap: 12px; align-items: center; }
.choices.ox .choice { justify-content: center; font-size: 40px; font-weight: 800; padding: 6px; }
.choice .k { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800; display: grid; place-items: center; font-size: 14px; }
.choice:hover:not([disabled]) { border-color: var(--accent); background: #f4fbfa; }
.choice.correct { border-color: var(--ok); background: var(--ok-soft); }
.choice.wrong { border-color: var(--ng); background: var(--ng-soft); }
.choice[disabled] { cursor: default; }
.explain { margin-top: 14px; padding: 12px 16px; border-radius: 12px; background: #f1f7f6; border: 1px solid var(--line); }
.explain b.ok { color: var(--ok); }
.explain b.ng { color: var(--ng); }
.progress { height: 8px; border-radius: 99px; background: #dfeceb; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--coral); transition: width .3s; }

/* ---------- sort ---------- */
.sortarea { text-align: center; }
.card-big { display: inline-block; min-width: 320px; max-width: 90%; margin: 18px auto 22px; padding: 26px 30px; background: #fff; border: 3px solid var(--accent); border-radius: 18px; font-size: 26px; font-weight: 800; box-shadow: 0 6px 0 var(--accent-soft); }
.card-big.ok { border-color: var(--ok); background: var(--ok-soft); }
.card-big.ng { border-color: var(--ng); background: var(--ng-soft); animation: shake .4s; }
.bins { display: grid; gap: 12px; }
.bin { background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 18px 10px; font-size: 18px; font-weight: 800; min-height: 96px; position: relative; }
.bin:hover { border-color: var(--accent); background: #f4fbfa; }
.bin .kb { position: absolute; top: 6px; left: 10px; font-size: 12px; color: var(--sub); }
.bin.hit { border-color: var(--ok); background: var(--ok-soft); }
.bin.hint { border-color: var(--ok); border-style: dashed; }
.hud { display: flex; gap: 18px; justify-content: center; font-weight: 700; color: var(--sub); flex-wrap: wrap; }
.hud b { color: var(--ink); font-size: 20px; }
.match { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 10px; align-items: start; max-width: 860px; margin: 18px auto 0; }
.match .col { display: grid; gap: 10px; }
.mitem { background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 17px; font-weight: 700; text-align: center; }
.mitem:hover:not([disabled]) { border-color: var(--accent); }
.mitem.sel { border-color: var(--coral); background: #fff4ef; box-shadow: 0 0 0 3px rgba(231,111,81,.2); }
.mitem.done { color: #fff; border-color: transparent; cursor: default; }
.mitem.shake { animation: shake .4s; border-color: var(--ng); }

/* ---------- digest ---------- */
.dig { display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
.tract svg { width: 100%; height: auto; display: block; }
.tract .node rect { fill: #fff; stroke: #a9c9c5; stroke-width: 2; }
.tract .node text { font-size: 14px; font-weight: 700; fill: var(--ink); }
.tract .node text.s { font-size: 11px; font-weight: 400; fill: var(--sub); }
.tract .node.on rect { fill: #fff1d6; stroke: var(--coral); stroke-width: 4; }
.tract .node.done rect { fill: #eef7f5; }
.tract .arrow { stroke: #8fb3ae; stroke-width: 2.5; fill: none; marker-end: url(#ah); }
.molbox { background: #f6fbfa; border: 2px solid var(--line); border-radius: 16px; padding: 16px; min-height: 150px; position: relative; display: flex; flex-wrap: wrap; gap: 16px 22px; align-items: flex-end; justify-content: center; }
.molbox .mw { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.molbox .mw > .mname { font-size: 13px; font-weight: 800; color: var(--accent); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 0 10px; }
.mini .shape { width: 40px; height: 40px; font-size: 12px; }
.mini .sh-circ { width: 32px; height: 32px; }
.mini .sh-base { width: 34px; height: 40px; }
.mini .sh-base b { font-size: 16px; }
.mini .sh-aa { border-width: 3px; }
.mini .sh-aa::after { display: none; }
.mini .sh-bar { width: 26px; height: 74px; font-size: 11px; }
.mini .sh-zig { width: 64px; height: 24px; font-size: 11px; }
.mini .blk small { display: none; }
.mini .bond { min-width: 14px; margin-top: 0; }
.mini .bond .bl { min-width: 12px; height: 5px; }
.mini .bond .bn { display: none; }
.mini .fatmol .arm { min-height: 24px; }
.mini .fatmol .arms { gap: 1px; }
.emul { position: absolute; inset: 0; pointer-events: none; }
.emul i { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff8d9, #e9c46a); border: 1px solid #c9a44b; animation: emul 1.4s ease-out forwards; }
@keyframes emul { 0% { transform: translate(0,0) scale(1.8); opacity: 0; } 30% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.7); opacity: 0; } }
.dest { font-size: 14px; font-weight: 800; color: #fff; background: var(--coral); border-radius: 999px; padding: 2px 12px; }
.slide-out { animation: slideout .9s ease-in forwards; }
@keyframes slideout { to { transform: translateY(40px) scale(.8); opacity: .15; } }

/* ---------- result / modal ---------- */
.result { text-align: center; max-width: 640px; margin: 20px auto; }
.result .big { font-size: 46px; letter-spacing: 6px; }
.result h2 { font-size: 28px; }
.xpgain { display: inline-block; background: #fff1c9; color: #7a5300; font-weight: 800; border-radius: 999px; padding: 4px 16px; margin: 8px 0; }
.overlay { position: fixed; inset: 0; background: rgba(8, 40, 46, .55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: #fff; border-radius: 18px; max-width: 520px; width: 100%; padding: 22px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.modal label { display: block; font-weight: 700; margin: 12px 0 4px; }
.modal input { width: 100%; font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 10px; }
.formrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.note { font-size: 13px; color: var(--sub); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--hdr); color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 700; z-index: 60; animation: popin .3s; }
.levelup { position: fixed; inset: 0; display: grid; place-items: center; z-index: 70; pointer-events: none; }
.levelup div { background: linear-gradient(135deg, #fff6d5, #ffe08a); border: 4px solid var(--gold); color: #5a3b00; font-size: 26px; font-weight: 800; padding: 24px 40px; border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: popin .5s; text-align: center; }

/* ---------- zukan ---------- */
.zk { display: grid; grid-template-columns: 220px 1fr; gap: 16px; align-items: start; }
.zk nav { display: grid; gap: 6px; position: sticky; top: 70px; }
.zk nav button { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 700; }
.zk nav button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.fig { background: #fbfefd; border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 10px 0; text-align: center; overflow-x: auto; }
.fig svg { max-width: 100%; height: auto; }
.fig svg text { font-family: inherit; }
.fig .cap { font-size: 12px; color: var(--sub); }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; margin: 8px 0; }
table.t th, table.t td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
table.t th { background: #eef7f5; }
.points li { margin: 4px 0; }

/* ---------- record ---------- */
.card-record { max-width: 760px; margin: 0 auto; background: #fff; border: 3px solid var(--hdr); border-radius: 18px; overflow: hidden; }
.card-record .top { background: var(--hdr); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.card-record .body { padding: 16px 20px; }
.card-record table.t th:first-child, .card-record table.t td:nth-child(2) { white-space: nowrap; }
.card-record .code { font-family: "Consolas", "Menlo", monospace; font-size: 22px; font-weight: 800; letter-spacing: .12em; color: var(--hdr); }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge { border: 2px solid var(--gold); background: #fff8e3; border-radius: 999px; padding: 2px 12px; font-size: 14px; font-weight: 700; }
.badge.off { border-color: #d5dfdd; background: #f4f7f6; color: #9aaeaa; }
textarea.copy { width: 100%; min-height: 160px; font-family: "Consolas", "Menlo", monospace; font-size: 13px; border: 2px solid var(--line); border-radius: 10px; padding: 10px; }
details.teacher { max-width: 760px; margin: 18px auto 0; }
details.teacher summary { cursor: pointer; color: var(--sub); font-weight: 700; }

@media (max-width: 860px) {
  .rooms, .rooms.small { grid-template-columns: 1fr; }
  .dig { grid-template-columns: 1fr; }
  .tract { max-width: 360px; margin: 0 auto; }
  .zk { grid-template-columns: 1fr; }
  .zk nav { position: static; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  #hdr .xpbar { display: none; }
  .hero { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}
@media print {
  #hdr, .noprint { display: none !important; }
  body { background: #fff; }
}
</style>

<body>
<header id="hdr"></header>
<main id="app"></main>

<script>
'use strict';
/* =====================================================================
   ここから下はアプリ本体のプログラムです（通常は編集不要）
   ===================================================================== */

// ---------- パーツ（単量体など）の定義 ----------
const PIECES = {
  glc:   { name: 'グルコース', label: 'Glc', shape: 'hex', color: '#f2b632', cat: 'sugar', L: 'HO', R: 'OH', hint: 'ブドウ糖ともいう単糖。デンプン・マルトースの材料' },
  fru:   { name: 'フルクトース', label: 'Fru', shape: 'pent', color: '#f08c3a', cat: 'sugar', L: 'HO', R: 'OH', hint: '果糖ともいう単糖' },
  gal:   { name: 'ガラクトース', label: 'Gal', shape: 'hex', color: '#b5c935', cat: 'sugar', L: 'HO', R: 'OH', hint: '乳糖（ラクトース）の材料になる単糖' },
  rib:   { name: 'リボース', label: 'R', shape: 'pent', color: '#7cc47f', cat: 'sugar', L: 'HO', R: 'OH', hint: 'RNAやATPに含まれる糖' },
  dR:    { name: 'デオキシリボース', label: 'dR', shape: 'pent', color: '#3fb3a3', cat: 'sugar', L: 'HO', R: 'OH', hint: 'DNAに含まれる糖' },
  aaGly: { name: 'グリシン', label: 'Gly', shape: 'aa', color: '#f37b63', cat: 'aa', L: 'H₂N', R: 'COOH', hint: 'アミノ酸の一種' },
  aaAla: { name: 'アラニン', label: 'Ala', shape: 'aa', color: '#e45a84', cat: 'aa', L: 'H₂N', R: 'COOH', hint: 'アミノ酸の一種' },
  aaSer: { name: 'セリン', label: 'Ser', shape: 'aa', color: '#c77dff', cat: 'aa', L: 'H₂N', R: 'COOH', hint: 'アミノ酸の一種' },
  aaCys: { name: 'システイン', label: 'Cys', shape: 'aa', color: '#e6d34c', cat: 'aa', L: 'H₂N', R: 'COOH', hint: '硫黄（S）を含むアミノ酸' },
  aaLys: { name: 'リシン', label: 'Lys', shape: 'aa', color: '#5fa8e8', cat: 'aa', L: 'H₂N', R: 'COOH', hint: 'アミノ酸の一種' },
  glyc:  { name: 'グリセリン', label: 'グリセリン', shape: 'bar', color: '#c9a27a', cat: 'glyc', hint: '脂肪の材料。–OHを3つもつ' },
  fa:    { name: '脂肪酸', label: '脂肪酸', shape: 'zig', color: '#e9c46a', cat: 'fa', L: 'HOOC', hint: '脂肪の材料。長い鎖をもつ' },
  P:     { name: 'リン酸', label: 'P', shape: 'circ', color: '#a99bd6', cat: 'P', L: 'HO', R: 'OH', hint: 'ヌクレオチドやATPに含まれる' },
  bA:    { name: 'アデニン', label: 'A', shape: 'base', color: '#d94b5f', cat: 'base', hint: '塩基の一種' },
  bT:    { name: 'チミン', label: 'T', shape: 'base', color: '#3a86d6', cat: 'base', hint: 'DNAだけにある塩基' },
  bG:    { name: 'グアニン', label: 'G', shape: 'base', color: '#2a9d5c', cat: 'base', hint: '塩基の一種' },
  bC:    { name: 'シトシン', label: 'C', shape: 'base', color: '#d98a12', cat: 'base', hint: '塩基の一種' },
  bU:    { name: 'ウラシル', label: 'U', shape: 'base', color: '#8a5cc7', cat: 'base', hint: 'RNAだけにある塩基' },
};
const BOND_TYPES = {
  'sugar-sugar': { name: 'グリコシド結合', f: '–O–' },
  'aa-aa':       { name: 'ペプチド結合', f: '–CO–NH–' },
  'fa-glyc':     { name: 'エステル結合', f: '–O–CO–' },
  'P-sugar':     { name: 'リン酸–糖', f: '–O–' },
  'base-sugar':  { name: '糖–塩基', f: 'C–N' },
  'P-P':         { name: '高エネルギーリン酸結合', f: '〜' },
};
function bondOf(a, b) {
  const k = [PIECES[a].cat, PIECES[b].cat].sort().join('-');
  return BOND_TYPES[k] || { name: '結合', f: '–' };
}
const DNA_PAIR = { bA: 'bT', bT: 'bA', bG: 'bC', bC: 'bG' };
const RNA_PAIR = { bA: 'bU', bT: 'bA', bG: 'bC', bC: 'bG' };
const HB = { bA: 2, bT: 2, bU: 2, bG: 3, bC: 3 };

const RANKS = [
  { xp: 0, name: '見習い研究員' }, { xp: 100, name: '研究助手' }, { xp: 300, name: '研究員' },
  { xp: 550, name: '主任研究員' }, { xp: 850, name: 'ラボリーダー' }, { xp: 1150, name: '博士' },
];
const ROOM_NAMES = { build: '合成ルーム', sort: '分類ラボ', quiz: '研究員昇格試験', digest: '消化管探検ミッション' };

// ---------- 便利関数 ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const starsHtml = (n, max = 3) => `<span class="stars" aria-label="星${n}つ">${'★'.repeat(n)}<span class="off">${'★'.repeat(Math.max(0, max - n))}</span></span>`;
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtSec = s => `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}`;
function starsByMistakes(n) { return n === 0 ? 3 : n <= 2 ? 2 : 1; }

// ---------- 保存 ----------
const KEY = 'koubunshi-lab-v1';
function blank() { return { v: 1, profile: null, build: {}, sort: {}, quiz: {}, digest: {}, miss: {}, mute: false, formula: false, first: null, last: null }; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return Object.assign(blank(), s); } catch (e) { /* 保存できない環境 */ }
  return blank();
}
let S = load();
function save() { S.last = Date.now(); if (!S.first) S.first = S.last; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 保存できない環境 */ } }
function addMiss(key, text) { const o = S.miss[key] || { n: 0, t: text }; o.n++; o.t = text; S.miss[key] = o; }

// ---------- XP・称号 ----------
function calcXP() {
  let x = 0;
  for (const k in S.build) x += (S.build[k].stars || 0) * 15;
  for (const k in S.sort) x += (S.sort[k].stars || 0) * 15;
  for (const k in S.quiz) x += Math.round((S.quiz[k].best || 0) / (S.quiz[k].n || QUIZ_PER_PLAY) * QUIZ_PER_PLAY) * 10;
  for (const k in S.digest) x += (S.digest[k].stars || 0) * 20;
  return x;
}
function rankOf(x) { let r = RANKS[0], next = null; for (let i = 0; i < RANKS.length; i++) { if (x >= RANKS[i].xp) { r = RANKS[i]; next = RANKS[i + 1] || null; } } return { r, next }; }
function withXP(fn) {
  const before = calcXP(), rb = rankOf(before).r.name;
  fn(); save();
  const after = calcXP(), ra = rankOf(after).r.name;
  renderHeader();
  if (ra !== rb) setTimeout(() => levelUp(ra), 700);
  return after - before;
}
function levelUp(name) {
  sfx('fanfare');
  const d = document.createElement('div');
  d.className = 'levelup';
  d.innerHTML = `<div>🎉 昇格！<br>あなたは「${esc(name)}」になりました</div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2600);
}

// ---------- 効果音 ----------
let actx = null;
function tone(f, t0, dur, type = 'sine', vol = .12) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, actx.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + dur + .02);
}
function sfx(kind) {
  if (S.mute) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (kind === 'ok') { tone(660, 0, .12); tone(990, .09, .18); }
    else if (kind === 'ng') { tone(180, 0, .25, 'square', .06); }
    else if (kind === 'pop') { tone(520, 0, .08, 'triangle'); }
    else if (kind === 'clear') { [523, 659, 784, 1046].forEach((f, i) => tone(f, i * .1, .25)); }
    else if (kind === 'fanfare') { [523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, i * .12, .3, 'triangle')); }
  } catch (e) { /* 音が出せない環境 */ }
}

// ---------- 画面管理 ----------
const app = document.getElementById('app');
let cleanups = [];
let onKey = null;
function view(html) {
  cleanups.forEach(f => f()); cleanups = []; onKey = null;
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (onKey) onKey(e);
});
function toast(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2000);
}

function renderHeader() {
  const x = calcXP(), { r, next } = rankOf(x);
  const pct = next ? Math.round((x - r.xp) / (next.xp - r.xp) * 100) : 100;
  const p = S.profile;
  document.getElementById('hdr').innerHTML = `
    <button class="logo" id="hHome" title="ホームへ"><span class="cell"></span>高分子ラボ</button>
    <div class="me">
      ${p ? `<span>${esc(p.cls)} ${esc(p.no)}番 ${esc(p.name)}</span>` : ''}
      <span class="rank" title="称号">${esc(r.name)}</span>
      <span title="${next ? `次の称号「${next.name}」まで ${next.xp - x} XP` : '最高の称号です'}">XP ${x}</span>
      <span class="xpbar" aria-hidden="true"><i style="width:${pct}%"></i></span>
      <button class="hbtn" id="hRec">📒 学習記録</button>
      <button class="hbtn" id="hMute" aria-pressed="${S.mute}">${S.mute ? '🔇 音なし' : '🔊 音あり'}</button>
    </div>`;
  $('#hHome').onclick = () => go('home');
  $('#hRec').onclick = () => go('record');
  $('#hMute').onclick = () => { S.mute = !S.mute; save(); renderHeader(); };
}

function go(name, ...args) { SCREENS[name](...args); }

// ---------- 分子の描画 ----------
function blockHtml(id, opt = {}) {
  const p = PIECES[id];
  const ends = (opt.endL ? `<span class="end l">${esc(opt.endL)}–</span>` : '') + (opt.endR ? `<span class="end r">–${esc(opt.endR)}</span>` : '');
  return `<div class="blk${opt.cls ? ' ' + opt.cls : ''}" title="${esc(p.name)}">${ends}<div class="shape sh-${p.shape}" style="--c:${p.color}"><b>${esc(p.label)}</b></div><small>${esc(p.name)}</small></div>`;
}
function bondHtml(a, b, formula, isNew) {
  const bd = bondOf(a, b), hi = bd.f === '〜';
  return `<div class="bond${hi ? ' hi' : ''}"${isNew ? ' data-new="1"' : ''}>${formula ? `<span class="bf">${esc(bd.f)}</span>` : ''}<span class="bl"></span><span class="bn">${esc(bd.name)}</span></div>`;
}
// 一列の分子（空き枠つき）。slots: [id|null], 各枠の目標 targets
function chainHtml(items, opt = {}) {
  const formula = !!opt.formula;
  let h = '<div class="mol">';
  items.forEach((it, i) => {
    if (i > 0) {
      const prev = items[i - 1];
      if (prev.id && it.id) h += bondHtml(prev.id, it.id, formula, opt.newAt === i || opt.newAt === i - 1);
      else h += '<div class="gap">+</div>';
    }
    if (it.id) {
      const p = PIECES[it.id];
      const leftFree = i === 0 || !items[i - 1].id, rightFree = i === items.length - 1 || !items[i + 1].id;
      h += blockHtml(it.id, { endL: formula && leftFree ? p.L : '', endR: formula && rightFree ? p.R : '', cls: opt.newAt === i ? 'popin' : '' });
    } else {
      h += `<div class="slot${it.next ? ' next' : ''}">${it.label ? esc(it.label) : '？'}</div>`;
    }
  });
  return h + '</div>';
}
// 脂肪（グリセリン＋脂肪酸）
function fatHtml(glycId, arms, opt = {}) {
  const formula = !!opt.formula;
  let h = '<div class="fatmol"><div class="bar-wrap">';
  h += glycId ? blockHtml('glyc', { cls: opt.newAt === 0 ? 'popin' : '' }) : `<div class="slot bar${opt.nextGlyc ? ' next' : ''}">${opt.showNames ? 'グリセリン' : '？'}</div>`;
  h += '</div><div class="arms">';
  arms.forEach((a, i) => {
    h += '<div class="arm">';
    if (glycId && a) h += bondHtml('glyc', 'fa', formula, opt.newAt === i + 1 || (opt.newAt === 0));
    else if (glycId && formula) h += '<span class="oh">–OH</span>';
    else h += '<div class="gap" style="margin-top:0">+</div>';
    h += a ? blockHtml('fa', { cls: opt.newAt === i + 1 ? 'popin' : '', endR: formula ? 'R' : '' }) : `<div class="slot zig${opt.nextArm === i ? ' next' : ''}">${opt.showNames ? '脂肪酸' : '？'}</div>`;
    h += '</div>';
  });
  return h + '</div></div>';
}
// 消化画面などで使う小さな分子
function molHtml(mol) {
  const p = mol.p;
  let inner;
  if (p[0] === 'glyc') inner = fatHtml('glyc', p.slice(1).map(() => 'fa'));
  else inner = chainHtml(p.map(id => ({ id })));
  return `<div class="mw"><div class="mini">${inner}</div><span class="mname">${esc(mol.n)}</span></div>`;
}
function spawnBubbles(container, targets, text, cls = '') {
  const cr = container.getBoundingClientRect();
  targets.forEach((t, i) => {
    const r = t.getBoundingClientRect();
    const b = document.createElement('div');
    b.className = 'bubble ' + cls; b.textContent = text;
    b.style.left = (r.left - cr.left + r.width / 2 + container.scrollLeft) + 'px';
    b.style.top = (r.top - cr.top - 4) + 'px';
    b.style.animationDelay = (i * 0.12) + 's';
    container.appendChild(b);
    setTimeout(() => b.remove(), 2000 + i * 120);
  });
}

SCREENS.build = (idx) => {
  const st = BUILD_STAGES[idx];
  const type = st.type || 'chain';
  const slots = type === 'pair' ? st.template.map(() => null) : st.slots.map(() => null);
  const targets = type === 'pair' ? st.template.map(t => (st.mode === 'rna' ? RNA_PAIR : DNA_PAIR)[t]) : st.slots;
  const g = { mistakes: 0, done: false, lastAt: -1 };

  view(`
    <button class="back" id="bk">← ステージ一覧</button>
    <div class="row"><h2 class="grow">STAGE ${idx + 1}　${esc(st.title)}</h2><span class="tag">${esc(st.group)}</span></div>
    <div class="goal">🎯 ${esc(st.goal)}</div>
    <div class="bench" id="bench"></div>
    <div class="toolbar">
      <span class="muted grow" id="miss">まちがい：0</span>
      ${type === 'pair' ? '' : `<button class="switch" id="fx" aria-pressed="${S.formula}">⚗️ 構造式モード ${S.formula ? 'ON' : 'OFF'}</button>`}
      <button class="btn sub small" id="reset">やり直す</button>
    </div>
    <div class="msg" id="msg">下のパーツから選んでね</div>
    <div class="palette" id="pal">
      ${st.palette.map(id => `<button class="pc" data-p="${id}" aria-label="${esc(PIECES[id].name)}">${blockHtml(id)}</button>`).join('')}
    </div>
    <div id="after"></div>`);
  $('#bk').onclick = () => go('buildList');
  $('#reset').onclick = () => go('build', idx);
  if ($('#fx')) $('#fx').onclick = () => { S.formula = !S.formula; save(); $('#fx').setAttribute('aria-pressed', S.formula); $('#fx').textContent = `⚗️ 構造式モード ${S.formula ? 'ON' : 'OFF'}`; draw(-1); };

  function nextIndex(pieceId) {
    if (type === 'pair' || st.ordered) return slots.indexOf(null);
    return slots.findIndex((s, i) => s === null && targets[i] === pieceId);
  }
  function draw(newAt) {
    const bench = $('#bench');
    const nx = slots.indexOf(null);
    if (type === 'fat') {
      const nextArm = slots.slice(1).indexOf(null);
      bench.innerHTML = fatHtml(slots[0], slots.slice(1), { formula: S.formula, newAt, nextGlyc: !slots[0], nextArm: slots[0] ? nextArm : -1, showNames: st.showNames });
    } else if (type === 'pair') {
      const label = st.mode === 'rna' ? ['DNA（鋳型鎖）', 'RNA'] : ['DNA', '相補鎖'];
      let h = '<div class="pairmol">';
      h += `<span class="lab">${label[0]}</span><span></span><span class="lab">${label[1]}</span>`;
      st.template.forEach((t, i) => {
        h += `<div class="top">${blockHtml(t)}</div>`;
        h += slots[i] ? `<div class="hb" title="水素結合 ${HB[t]}本">${'<i></i>'.repeat(HB[t])}</div>` : '<div class="hb"></div>';
        h += slots[i] ? blockHtml(slots[i], { cls: newAt === i ? 'popin' : '' }) : `<div class="slot${i === nx ? ' next' : ''}">？</div>`;
      });
      bench.innerHTML = h + '</div>';
    } else {
      const items = slots.map((id, i) => ({ id, label: st.showNames ? PIECES[targets[i]].name : '', next: st.ordered && i === nx }));
      bench.innerHTML = chainHtml(items, { formula: S.formula, newAt });
    }
    if (newAt >= 0 && type !== 'pair') {
      const nb = $$('.bond[data-new]', bench);
      if (nb.length) spawnBubbles(bench, nb, 'H₂O');
    }
  }
  function hintFor(pid, at) {
    if (type === 'pair') {
      const t = st.template[at];
      if (st.mode === 'rna' && pid === 'bT') return 'RNAにはチミン（T）がないよ。かわりに何を使う？';
      if (st.mode === 'dna' && pid === 'bU') return 'ウラシル（U）はRNAの塩基。DNAには使わないよ。';
      return `${PIECES[t].name}（${PIECES[t].label}）と対になる塩基を考えよう。A–${st.mode === 'rna' ? 'U' : 'T'}、G–C がペアだよ。`;
    }
    const p = PIECES[pid];
    if (!targets.includes(pid)) return `「${p.name}」は${p.hint}。この分子の材料ではないよ。`;
    if (st.ordered) return `順番がちがうよ。次は「${PIECES[targets[at]].name}」。`;
    return `「${p.name}」はもう足りているよ。`;
  }
  function pick(pid, btn) {
    if (g.done) return;
    const at = nextIndex(pid);
    const want = at >= 0 ? targets[at] : null;
    const okPick = type === 'pair' || st.ordered ? (at >= 0 && want === pid) : at >= 0;
    if (!okPick) {
      g.mistakes++;
      addMiss('build:' + st.id + ':' + pid, `【合成】${st.title}：${PIECES[pid].name}を選んだ`);
      save();
      sfx('ng');
      btn.classList.remove('shake'); void btn.offsetWidth; btn.classList.add('shake');
      $('#msg').className = 'msg ng';
      $('#msg').textContent = '✖ ' + hintFor(pid, type === 'pair' || st.ordered ? slots.indexOf(null) : at);
      $('#miss').textContent = `まちがい：${g.mistakes}`;
      return;
    }
    slots[at] = pid;
    const bonded = type === 'pair' ? false : (type === 'fat' ? (at === 0 ? slots.slice(1).some(Boolean) : !!slots[0]) : ((at > 0 && slots[at - 1]) || (at < slots.length - 1 && slots[at + 1])));
    sfx(bonded ? 'ok' : 'pop');
    draw(at);
    $('#msg').className = 'msg ok';
    if (type === 'pair') $('#msg').textContent = `○ ${PIECES[st.template[at]].label}–${PIECES[pid].label}（水素結合 ${HB[pid]}本）`;
    else if (bonded) {
      const nb = type === 'fat' ? bondOf('glyc', 'fa') : bondOf(pid, (at > 0 && slots[at - 1]) || slots[at + 1]);
      $('#msg').textContent = `○ 脱水縮合！ 水（H₂O）が取れて「${nb.name}」でつながった`;
    } else $('#msg').textContent = `○ ${PIECES[pid].name}を置いた`;
    if (!slots.includes(null)) finish();
  }
  function finish() {
    g.done = true;
    sfx('clear');
    $('#msg').className = 'msg ok';
    $('#msg').innerHTML = `🎉 「${esc(st.product)}」が完成！ 最後に確認問題に答えよう。`;
    $('#pal').style.display = 'none';
    const q = st.quiz;
    const order = shuffle(q.c.map((t, i) => ({ t, ok: i === 0 })));
    $('#after').innerHTML = `<div class="panel qcard" style="margin-top:14px">
      <div class="qtext">Q. ${esc(q.q)}</div>
      <div class="choices">${order.map((o, i) => `<button class="choice" data-i="${i}"><span class="k">${i + 1}</span>${esc(o.t)}</button>`).join('')}</div>
      <div id="qx"></div></div>`;
    $('#after').scrollIntoView({ behavior: 'smooth', block: 'start' });
    $$('#after .choice').forEach(btn => btn.onclick = () => {
      const o = order[+btn.dataset.i];
      if (o.ok) {
        sfx('ok');
        btn.classList.add('correct');
        $$('#after .choice').forEach(b => b.disabled = true);
        $('#qx').innerHTML = `<div class="explain"><b class="ok">正解！</b> ${esc(q.ex)}</div><div class="row" style="justify-content:center;margin-top:14px"><button class="btn coral" id="toRes">結果を見る</button></div>`;
        $('#toRes').onclick = result;
        onKey = e => { if (e.key === 'Enter') result(); };
      } else {
        sfx('ng');
        g.mistakes++;
        $('#miss').textContent = `まちがい：${g.mistakes}`;
        addMiss('build:' + st.id + ':quiz', `【合成】${st.title}：${q.q}`);
        save();
        btn.classList.add('wrong'); btn.disabled = true;
        $('#qx').innerHTML = '<div class="explain"><b class="ng">ちがうよ。</b> もう一度考えてみよう。</div>';
      }
    });
    onKey = e => { const n = +e.key; if (n >= 1 && n <= order.length) { const b = $$('#after .choice')[n - 1]; if (b && !b.disabled) b.click(); } };
  }
  function result() {
    const stars = starsByMistakes(g.mistakes);
    const gain = withXP(() => {
      const old = S.build[st.id];
      S.build[st.id] = { stars: Math.max(stars, old ? old.stars : 0), plays: ((old && old.plays) || 0) + 1, lastMistakes: g.mistakes };
    });
    resultScreen({
      title: `「${st.product}」完成！`, stars, gain,
      lines: [`まちがい：${g.mistakes}回`],
      retry: () => go('build', idx),
      next: idx + 1 < BUILD_STAGES.length ? () => go('build', idx + 1) : null,
      list: () => go('buildList'),
    });
  }
  $$('#pal .pc').forEach(btn => btn.onclick = () => pick(btn.dataset.p, btn));
  onKey = e => { const n = +e.key; if (n >= 1 && n <= st.palette.length) { const b = $$('#pal .pc')[n - 1]; if (b) b.click(); } };
  draw(-1);
};

function startTimer(el) {
  const t0 = Date.now();
  const iv = setInterval(() => { if (el.isConnected) el.textContent = fmtSec((Date.now() - t0) / 1000); }, 250);
  cleanups.push(() => clearInterval(iv));
  return () => (Date.now() - t0) / 1000;
}
function sortFinish(idx, stars, score, lines, extra) {
  const st = SORT_STAGES[idx];
  if (stars > 0) sfx('clear');
  const gain = withXP(() => {
    const old = S.sort[st.id] || { stars: 0, best: 0, plays: 0 };

SCREENS.sortBins = (idx) => {
  const st = SORT_STAGES[idx];
  let cards = shuffle(st.cards);
  if (st.draw && st.draw < cards.length) cards = cards.slice(0, st.draw);
  const g = { i: 0, ok: 0, ng: 0, combo: 0, maxCombo: 0, lock: false, wrongs: [] };
  view(`
    <button class="back" id="bk">← ステージ一覧</button>
    <h2>${esc(st.title)}</h2>
    <div class="hud"><span>カード <b id="hi">1</b> / ${cards.length}</span><span>正解 <b id="hok">0</b></span><span>コンボ <b id="hc">0</b></span><span>時間 <b id="ht">0:00</b></span></div>
    <div class="sortarea">
      <div class="card-big" id="card"></div>
      <div class="bins" style="grid-template-columns:repeat(${st.bins.length},1fr)">
        ${st.bins.map((b, i) => `<button class="bin" data-b="${i}"><span class="kb">${i + 1}</span>${esc(b)}</button>`).join('')}
      </div>
      <div class="msg" id="msg"></div>
    </div>`);
  $('#bk').onclick = () => go('sortList');
  const elapsed = startTimer($('#ht'));
  function show() {
    $('#card').className = 'card-big popin';
    $('#card').textContent = cards[g.i][0];
    $('#hi').textContent = g.i + 1;
    $$('.bin').forEach(b => b.classList.remove('hit', 'hint'));
  }
  function answer(bi) {
    if (g.lock) return;
    g.lock = true;
    const [text, ans] = cards[g.i];
    const bins = $$('.bin');
    if (bi === ans) {
      g.ok++; g.combo++; g.maxCombo = Math.max(g.maxCombo, g.combo);
      sfx('ok');
      $('#card').className = 'card-big ok';
      bins[bi].classList.add('hit');
      $('#msg').className = 'msg ok'; $('#msg').textContent = g.combo >= 3 ? `○ ${g.combo}コンボ！` : '○ 正解！';
    } else {
      g.ng++; g.combo = 0;
      sfx('ng');
      g.wrongs.push(`「${text}」→ ${st.bins[ans]}`);
      addMiss('sort:' + st.id + ':' + text, `【分類】「${text}」は ${st.bins[ans]}`);
      $('#card').className = 'card-big ng';
      bins[ans].classList.add('hint');
      $('#msg').className = 'msg ng'; $('#msg').textContent = `✖ 正解は「${st.bins[ans]}」`;
    }
    $('#hok').textContent = g.ok; $('#hc').textContent = g.combo;
    setTimeout(() => {
      if (!$('#card')) return;
      g.lock = false;
      g.i++;
      if (g.i >= cards.length) return end();
      $('#msg').textContent = '';
      show();
    }, bi === ans ? 600 : 1500);
  }
  function end() {
    const sec = elapsed();
    const acc = g.ok / cards.length;
    const stars = acc === 1 ? 3 : acc >= .8 ? 2 : acc >= .6 ? 1 : 0;
    const score = Math.max(0, g.ok * 100 + g.maxCombo * 20 - g.ng * 30 + Math.max(0, Math.round(cards.length * 8 - sec)) * 5);
    save();
    sortFinish(idx, stars, score,
      [`正解 ${g.ok} / ${cards.length}（${Math.round(acc * 100)}%）　最大コンボ ${g.maxCombo}　時間 ${fmtSec(sec)}`, `スコア <b>${score}</b> 点`],
      g.wrongs.length ? `<div class="explain" style="text-align:left"><b>まちがえたカード</b><ul style="margin:6px 0 0">${g.wrongs.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '');
  }
  $$('.bin').forEach(b => b.onclick = () => answer(+b.dataset.b));
  onKey = e => { const n = +e.key; if (n >= 1 && n <= st.bins.length) answer(n - 1); };
  show();
};

SCREENS.sortMatch = (idx) => {
  const st = SORT_STAGES[idx];
  const colors = ['#0d8a8c', '#e76f51', '#7b5cc4', '#2a9d5c', '#d98a12', '#3a86d6', '#c2477e', '#5b6b73'];
  const L = shuffle(st.pairs.map((p, i) => ({ t: p[0], k: i })));
  const R = shuffle(st.pairs.map((p, i) => ({ t: p[1], k: i })));
  const g = { sel: null, done: 0, miss: 0, wrongs: [] };
  view(`
    <button class="back" id="bk">← ステージ一覧</button>
    <h2>${esc(st.title)}</h2>
    <div class="hud"><span>ペア <b id="hd">0</b> / ${st.pairs.length}</span><span>まちがい <b id="hm">0</b></span><span>時間 <b id="ht">0:00</b></span></div>
    <p class="muted" style="text-align:center">左の項目をクリックしてから、ペアになる右の項目をクリックしよう。</p>
    <div class="match">
      <div class="col">${L.map((x, i) => `<button class="mitem" data-side="L" data-i="${i}">${esc(x.t)}</button>`).join('')}</div>
      <div></div>
      <div class="col">${R.map((x, i) => `<button class="mitem" data-side="R" data-i="${i}">${esc(x.t)}</button>`).join('')}</div>
    </div>
    <div class="msg" id="msg"></div>`);
  $('#bk').onclick = () => go('sortList');
  const elapsed = startTimer($('#ht'));
  $$('.mitem').forEach(el => el.onclick = () => {
    if (el.disabled) return;
    const side = el.dataset.side, item = (side === 'L' ? L : R)[+el.dataset.i];
    if (!g.sel || g.sel.side === side) {
      $$('.mitem.sel').forEach(x => x.classList.remove('sel'));
      el.classList.add('sel');
      g.sel = { side, item, el };
      sfx('pop');
      return;
    }
    const a = g.sel; g.sel = null;
    a.el.classList.remove('sel');
    if (a.item.k === item.k) {
      sfx('ok');
      g.done++;
      [a.el, el].forEach(x => { x.classList.add('done'); x.disabled = true; x.style.background = colors[g.done % colors.length]; });
      $('#hd').textContent = g.done;
      $('#msg').className = 'msg ok'; $('#msg').textContent = `○ ${st.pairs[item.k][0]} ＝ ${st.pairs[item.k][1]}`;
      if (g.done === st.pairs.length) {
        const sec = elapsed();
        const stars = g.miss === 0 ? 3 : g.miss <= 2 ? 2 : g.miss <= 4 ? 1 : 0;
        const score = Math.max(0, st.pairs.length * 100 - g.miss * 40 + Math.max(0, Math.round(st.pairs.length * 10 - sec)) * 5);
        save();
        setTimeout(() => $('#hd') && sortFinish(idx, stars, score,
          [`まちがい ${g.miss}回　時間 ${fmtSec(sec)}`, `スコア <b>${score}</b> 点`],
          `<div class="explain" style="text-align:left"><b>ペアのまとめ</b><ul style="margin:6px 0 0">${st.pairs.map(p => `<li>${esc(p[0])} ― ${esc(p[1])}</li>`).join('')}</ul></div>`), 700);
      }
    } else {
      sfx('ng');
      g.miss++;
      const lt = a.side === 'L' ? a.item : item;
      addMiss('sort:' + st.id + ':' + st.pairs[lt.k][0], `【分類】${st.pairs[lt.k][0]} ― ${st.pairs[lt.k][1]}`);
      $('#hm').textContent = g.miss;
      [a.el, el].forEach(x => { x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); });
      $('#msg').className = 'msg ng'; $('#msg').textContent = '✖ そのペアではないよ';
    }
  });
};

function isOX(c) { return c.length === 2 && c.includes('○') && c.includes('×'); }
SCREENS.quiz = (lv) => {
  const L = QUIZ_LEVELS.find(l => l.lv === lv);
  const pool = shuffle(QUIZ.filter(q => q.lv === lv)).slice(0, QUIZ_PER_PLAY);
  const g = { i: 0, ok: 0, wrongs: [], answered: false };
  function show() {
    const q = pool[g.i];
    const ox = isOX(q.c);
    const order = ox ? ['○', '×'].map(t => ({ t, ok: t === q.c[0] })) : shuffle(q.c.map((t, i) => ({ t, ok: i === 0 })));
    g.answered = false;
    view(`
      <button class="back" id="bk">← 試験をやめる</button>
      <div class="panel qcard">
        <div class="row"><span class="tag">Lv.${lv} ${esc(L.name)}</span><span class="grow"></span><span class="muted">第 ${g.i + 1} 問 / ${pool.length}　正解 ${g.ok}</span></div>
        <div class="progress" style="margin-top:8px"><i style="width:${g.i / pool.length * 100}%"></i></div>
        <div class="qtext">${esc(q.q.replace(/^【○×】/, ''))}</div>
        <div class="choices${ox ? ' ox' : ''}">${order.map((o, i) => `<button class="choice" data-i="${i}">${ox ? '' : `<span class="k">${i + 1}</span>`}${esc(o.t)}</button>`).join('')}</div>
        <div id="qx"></div>
      </div>`);
    $('#bk').onclick = () => { if (confirm('試験をやめますか？（記録は残りません）')) go('quizList'); };
    const btns = $$('.choice');
    btns.forEach(b => b.onclick = () => answer(+b.dataset.i));
    function answer(i) {
      if (g.answered) return;
      g.answered = true;
      const o = order[i];
      btns.forEach((b, j) => { b.disabled = true; if (order[j].ok) b.classList.add('correct'); });
      if (o.ok) { g.ok++; sfx('ok'); }
      else {
        sfx('ng'); btns[i].classList.add('wrong');
        g.wrongs.push(q);
        addMiss('quiz:' + q.id, `【試験】${q.q}`);
        save();
      }
      const last = g.i + 1 >= pool.length;
      $('#qx').innerHTML = `<div class="explain"><b class="${o.ok ? 'ok' : 'ng'}">${o.ok ? '正解！' : `不正解… 正解は「${esc(q.c[0])}」`}</b><br>${esc(q.ex)}</div>
        <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn coral" id="nx">${last ? '結果を見る' : '次の問題 →'}</button></div>`;
      $('#nx').focus();
      $('#nx').onclick = next;
      onKey = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } };
    }
    onKey = e => { const n = +e.key; if (n >= 1 && n <= order.length) answer(n - 1); };
  }
  function next() {
    g.i++;
    if (g.i < pool.length) return show();
    const pct = g.ok / pool.length;
    const stars = pct === 1 ? 3 : pct >= .8 ? 2 : pct >= .6 ? 1 : 0;
    if (pct >= .8) sfx('clear');
    const gain = withXP(() => {
      const old = S.quiz[lv];
      if (!old || g.ok / pool.length > old.best / old.n) S.quiz[lv] = { best: g.ok, n: pool.length, plays: ((old && old.plays) || 0) + 1, last: g.ok };
      else S.quiz[lv] = Object.assign({}, old, { plays: (old.plays || 0) + 1, last: g.ok });
    });
    const nextLv = QUIZ_LEVELS.find(l => l.lv === lv + 1);
    resultScreen({
      title: pct >= .8 ? `${L.name} 合格！` : `${L.name} 不合格… 8割で合格だよ`, stars, gain,
      lines: [`正解 ${g.ok} / ${pool.length}（${Math.round(pct * 100)}%）`],
      extra: g.wrongs.length ? `<div class="explain" style="text-align:left"><b>まちがえた問題の復習</b><ol style="margin:6px 0 0;padding-left:1.4em">${g.wrongs.map(q => `<li style="margin-bottom:6px">${esc(q.q)}<br><b class="ok">答：${esc(q.c[0])}</b>　<span class="muted">${esc(q.ex)}</span></li>`).join('')}</ol></div>` : '<p>🎉 全問正解！</p>',
      retry: () => go('quiz', lv),
      next: nextLv ? () => go('quiz', nextLv.lv) : null,
      list: () => go('quizList'),
    });
  }
  show();
};

const TRACT_NODES = {
  mouth:    { x: 110, y: 10,  w: 120, t: '口', s: 'だ液' },
  stomach:  { x: 110, y: 90,  w: 120, t: '胃', s: '胃液（強い酸性）' },
  small:    { x: 110, y: 170, w: 120, t: '小腸', s: '十二指腸・小腸の壁' },
  pancreas: { x: 0,   y: 170, w: 92,  t: 'すい臓', s: 'すい液' },
  gall:     { x: 248, y: 170, w: 92,  t: '肝臓・胆のう', s: '胆汁' },
  villi:    { x: 110, y: 250, w: 120, t: '柔毛', s: '吸収' },
  blood:    { x: 20,  y: 330, w: 140, t: '毛細血管', s: '→ 門脈' },
  lymph:    { x: 180, y: 330, w: 140, t: 'リンパ管', s: '→ 静脈と合流' },
  liver:    { x: 20,  y: 410, w: 140, t: '肝臓', s: '貯蔵・解毒' },
  cell:     { x: 180, y: 410, w: 140, t: '全身の細胞', s: '呼吸・合成' },
};
function tractSvg(on, visited) {
  const N = TRACT_NODES, H = 52;
  const c = (k, side) => { const n = N[k]; return side === 'b' ? [n.x + n.w / 2, n.y + H] : side === 't' ? [n.x + n.w / 2, n.y] : side === 'l' ? [n.x, n.y + H / 2] : [n.x + n.w, n.y + H / 2]; };
  const ar = (a, b) => `<line class="arrow" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1] - (b[1] > a[1] ? 4 : 0)}"/>`;
  let s = `<svg viewBox="-4 0 348 472" role="img" aria-label="消化管の模式図"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb3ae"/></marker></defs>`;
  s += ar(c('mouth', 'b'), c('stomach', 't')) + ar(c('stomach', 'b'), c('small', 't')) + ar(c('small', 'b'), c('villi', 't'));
  s += `<line class="arrow" x1="${N.pancreas.x + N.pancreas.w}" y1="${N.pancreas.y + 26}" x2="${N.small.x - 3}" y2="${N.small.y + 26}"/>`;
  s += `<line class="arrow" x1="${N.gall.x}" y1="${N.gall.y + 26}" x2="${N.small.x + N.small.w + 3}" y2="${N.small.y + 26}"/>`;
  s += ar([N.villi.x + 30, N.villi.y + H], c('blood', 't')) + ar([N.villi.x + N.villi.w - 30, N.villi.y + H], c('lymph', 't'));
  s += ar(c('blood', 'b'), c('liver', 't')) + ar(c('lymph', 'b'), c('cell', 't'));
  s += `<line class="arrow" x1="${N.liver.x + N.liver.w}" y1="${N.liver.y + 26}" x2="${N.cell.x - 3}" y2="${N.cell.y + 26}"/>`;
  for (const k in N) {
    const n = N[k];
    s += `<g class="node${on.includes(k) ? ' on' : visited.includes(k) ? ' done' : ''}"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${H}" rx="12"/><text x="${n.x + n.w / 2}" y="${n.y + 23}" text-anchor="middle">${n.t}</text><text class="s" x="${n.x + n.w / 2}" y="${n.y + 41}" text-anchor="middle">${n.s}</text></g>`;
  }
  return s + '</svg>';
}

SCREENS.digest = (idx) => {
  const st = DIGEST_STAGES[idx];
  const g = { step: 0, mols: st.start, mistakes: 0, visited: [] };
  function show() {
    const sp = st.steps[g.step];
    const order = shuffle(sp.c.map((t, i) => ({ t, ok: i === 0 })));
    let tried = 0;
    view(`
      <button class="back" id="bk">← ミッション一覧</button>
      <div class="row"><h2 class="grow">${st.icon} ${esc(st.title)}</h2><span class="muted">地点 ${g.step + 1} / ${st.steps.length}　まちがい ${g.mistakes}</span></div>
      <div class="dig">
        <div class="panel tract">${tractSvg(sp.at, g.visited)}</div>
        <div>
          <div class="molbox" id="mb">${g.mols.map(molHtml).join('')}</div>
          <div class="panel" style="margin-top:14px">
            <div class="qtext" style="margin-top:0">📍 ${esc(TRACT_NODES[sp.at[0]].t)}：${esc(sp.q)}</div>
            <div class="choices">${order.map((o, i) => `<button class="choice" data-i="${i}"><span class="k">${i + 1}</span>${esc(o.t)}</button>`).join('')}</div>
            <div id="qx"></div>
          </div>
        </div>
      </div>`);
    $('#bk').onclick = () => go('digestList');
    const btns = $$('.choice');
    function answer(i) {
      const o = order[i];
      if (btns[i].disabled) return;
      if (!o.ok) {
        tried++; g.mistakes++;
        sfx('ng');
        btns[i].classList.add('wrong'); btns[i].disabled = true;
        addMiss('digest:' + st.id + ':' + g.step, `【消化】${st.title}／${TRACT_NODES[sp.at[0]].t}：${sp.q}`);
        save();
        $('#qx').innerHTML = `<div class="explain"><b class="ng">ちがうよ。</b> ${tried >= 2 ? 'ヒント：その場所で出される消化液や、物質の性質を思い出そう。' : 'もう一度考えてみよう。'}</div>`;
        return;
      }
      sfx('ok');
      btns.forEach(b => b.disabled = true);
      btns[i].classList.add('correct');
      g.visited.push(...sp.at);
      animate(sp, () => {
        if (sp.after) g.mols = sp.after;
        $('#mb').innerHTML = g.mols.map(molHtml).join('');
        $$('#mb .mw').forEach(m => m.classList.add('popin'));
        if (sp.fx === 'absorb') {
          const dest = sp.at.includes('lymph') ? 'リンパ管へ' : '毛細血管へ';
          $$('#mb .mw').forEach(m => m.insertAdjacentHTML('beforeend', `<span class="dest">→ ${dest}</span>`));
        }
      });
      const last = g.step + 1 >= st.steps.length;
      $('#qx').innerHTML = `<div class="explain"><b class="ok">正解！</b> ${esc(sp.ex)}</div>
        <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn coral" id="nx">${last ? 'ミッション完了！' : '次の地点へ →'}</button></div>`;
      $('#nx').onclick = next;
      onKey = e => { if (e.key === 'Enter') next(); };
    }
    btns.forEach(b => b.onclick = () => answer(+b.dataset.i));
    onKey = e => { const n = +e.key; if (n >= 1 && n <= order.length) answer(n - 1); };
  }
  function animate(sp, then) {
    const mb = $('#mb');
    if (sp.fx === 'hydro') {
      const bonds = $$('.bond', mb).slice(0, 10);
      spawnBubbles(mb, bonds.length ? bonds : [mb], 'H₂O', 'in');
      setTimeout(then, 800);
    } else if (sp.fx === 'emulsify') {
      let h = '<div class="emul">';
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
        h += `<i style="left:50%;top:50%;--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d * .6}px;animation-delay:${i * 0.03}s"></i>`;
      }
      mb.insertAdjacentHTML('beforeend', h + '</div>');
      mb.insertAdjacentHTML('beforeend', '<div class="bubble" style="left:50%;top:20px">乳化！ 細かい粒に</div>');
      setTimeout(then, 1400);
    } else if (sp.fx === 'absorb') {
      $$('.mw', mb).forEach(m => m.classList.add('slide-out'));
      setTimeout(then, 900);
    } else if (sp.fx === 'build') {
      spawnBubbles(mb, [mb], '合成！');
      setTimeout(then, 500);
    } else then();
  }
  function next() {
    g.step++;
    if (g.step < st.steps.length) return show();
    const stars = starsByMistakes(g.mistakes);
    sfx('clear');
    const gain = withXP(() => {
      const old = S.digest[st.id];
      S.digest[st.id] = { stars: Math.max(stars, old ? old.stars : 0), plays: ((old && old.plays) || 0) + 1, lastMistakes: g.mistakes };
    });
    resultScreen({
      title: `ミッション「${st.title}」完了！`, stars, gain,
      lines: [`まちがい：${g.mistakes}回`],
      extra: `<div class="explain" style="text-align:left"><b>旅のまとめ</b><ol style="margin:6px 0 0;padding-left:1.4em">${st.steps.map(s => `<li>${esc(TRACT_NODES[s.at[0]].t)}：${esc(s.c[0])}</li>`).join('')}</ol></div>`,
      retry: () => go('digest', idx),
      next: idx + 1 < DIGEST_STAGES.length ? () => go('digest', idx + 1) : null,
      list: () => go('digestList'),
    });
  }
  show();
};

// =====================================================================
//  学習記録カード
// =====================================================================
function fnv(str) { let h = 0x811c9dc5; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function checkCode(body) {
  const a = fnv('KBLAB|' + body).toString(16).padStart(8, '0');
  const b = fnv(body + '|2026').toString(16).padStart(8, '0');
  return (a.slice(0, 4) + '-' + b.slice(0, 4)).toUpperCase();
}
function normBody(text) { return text.replace(/\r/g, '').split('\n').map(l => l.trimEnd()).join('\n').trim(); }
function badges() {
  const allBuild = BUILD_STAGES.every(s => S.build[s.id]);
  const allSort = SORT_STAGES.every(s => (S.sort[s.id] || {}).stars > 0);
  const allQuiz = QUIZ_LEVELS.every(l => S.quiz[l.lv] && S.quiz[l.lv].best / S.quiz[l.lv].n >= .8);
  const allDig = DIGEST_STAGES.every(s => S.digest[s.id]);
  const perfect = [...Object.values(S.build), ...Object.values(S.sort), ...Object.values(S.digest)].filter(r => r.stars === 3).length;
  return [
    { n: '🧪 合成マスター', on: allBuild, d: '合成ルームの全ステージをクリア' },
    { n: '🗂️ 分類マスター', on: allSort, d: '分類ラボの全ステージをクリア' },
    { n: '📝 試験全合格', on: allQuiz, d: '昇格試験のすべてのレベルに合格' },
    { n: '🫁 消化の達人', on: allDig, d: '消化管探検ミッションをすべて完了' },
    { n: '⭐ パーフェクト10', on: perfect >= 10, d: '★3つを10ステージで獲得' },
    { n: '🎓 博士号', on: rankOf(calcXP()).r.name === '博士', d: '称号「博士」に到達' },
  ];
}
function recordText() {
  const p = S.profile || { cls: '', no: '', name: '' };
  const x = calcXP();
  const lines = [];
  lines.push('【高分子ラボ 学習記録】');
  lines.push(`${p.cls} ${p.no}番 ${p.name}`);
  lines.push(`作成日時：${fmtDate(new Date())}`);
  lines.push(`称号：${rankOf(x).r.name}（XP ${x}）`);
  const bStars = BUILD_STAGES.reduce((a, s) => a + ((S.build[s.id] || {}).stars || 0), 0);
  lines.push(`■合成ルーム：${BUILD_STAGES.filter(s => S.build[s.id]).length}/${BUILD_STAGES.length}クリア ★${bStars}/${BUILD_STAGES.length * 3}`);
  const soStars = SORT_STAGES.reduce((a, s) => a + ((S.sort[s.id] || {}).stars || 0), 0);
  lines.push(`■分類ラボ：${SORT_STAGES.filter(s => (S.sort[s.id] || {}).stars > 0).length}/${SORT_STAGES.length}クリア ★${soStars}/${SORT_STAGES.length * 3}`);
  lines.push('■昇格試験：' + QUIZ_LEVELS.map(l => { const r = S.quiz[l.lv]; return `Lv${l.lv} ${r ? Math.round(r.best / r.n * 100) + '%' : '―'}`; }).join(' / '));
  const dStars = DIGEST_STAGES.reduce((a, s) => a + ((S.digest[s.id] || {}).stars || 0), 0);
  lines.push(`■消化管探検：${DIGEST_STAGES.filter(s => S.digest[s.id]).length}/${DIGEST_STAGES.length}完了 ★${dStars}/${DIGEST_STAGES.length * 3}`);
  const b = badges().filter(x => x.on).map(x => x.n.replace(/^\S+\s/, ''));
  lines.push('■バッジ：' + (b.length ? b.join('、') : 'なし'));
  const miss = Object.values(S.miss).sort((a, b) => b.n - a.n).slice(0, 5);
  lines.push('■まちがいが多かった内容：');
  if (miss.length) miss.forEach(m => lines.push(`・(${m.n}回) ${m.t}`));
  else lines.push('・なし');
  const body = normBody(lines.join('\n'));
  return { body, code: checkCode(body) };
}

            ${row('🧪 合成ルーム', BUILD_STAGES.filter(s => S.build[s.id]).length, BUILD_STAGES.length, BUILD_STAGES.map((s, i) => `${i + 1}${starsHtml((S.build[s.id] || {}).stars || 0)}`).join(' '))}
            ${row('🗂️ 分類ラボ', SORT_STAGES.filter(s => (S.sort[s.id] || {}).stars > 0).length, SORT_STAGES.length, SORT_STAGES.map((s, i) => `${i + 1}${starsHtml((S.sort[s.id] || {}).stars || 0)}`).join(' '))}
            ${row('📝 昇格試験', QUIZ_LEVELS.filter(l => S.quiz[l.lv] && S.quiz[l.lv].best / S.quiz[l.lv].n >= .8).length, QUIZ_LEVELS.length, QUIZ_LEVELS.map(l => { const r = S.quiz[l.lv]; return `Lv${l.lv}：${r ? Math.round(r.best / r.n * 100) + '%' : '―'}`; }).join('　'))}
            ${row('🫁 消化管探検', DIGEST_STAGES.filter(s => S.digest[s.id]).length, DIGEST_STAGES.length, DIGEST_STAGES.map(s => `${esc(s.title)}${starsHtml((S.digest[s.id] || {}).stars || 0)}`).join(' '))}
          </tbody>
        </table>
        <h4 style="margin:12px 0 6px">バッジ</h4>
        <div class="badges">${badges().map(b => `<span class="badge${b.on ? '' : ' off'}" title="${esc(b.d)}">${esc(b.n)}</span>`).join('')}</div>
        <h4 style="margin:14px 0 6px">まちがいが多かった内容（復習しよう）</h4>
        ${miss.length ? `<ol style="margin:0;padding-left:1.4em">${miss.map(m => `<li>${esc(m.t)} <span class="muted">（${m.n}回）</span></li>`).join('')}</ol>` : '<p class="muted" style="margin:0">まだありません</p>'}
        <div class="row" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:10px">
          <span class="muted grow">作成日時：${esc(body.split('\n')[2].replace('作成日時：', ''))}</span>
          <span>確認コード <span class="code">${code}</span></span>
        </div>
      </div>
    </div>
    <div class="panel noprint" style="max-width:760px;margin:16px auto 0">
      <h3>提出のしかた</h3>
      <ol style="margin:0 0 10px;padding-left:1.4em">
        <li><b>画面の撮影</b>：このカードのスクリーンショットを撮って提出（Chromebookは <kbd>Ctrl</kbd>＋<kbd>Shift</kbd>＋<kbd>ウィンドウを表示</kbd> キーで範囲を選んで撮影）</li>
        <li><b>文字で提出</b>：下の「記録をコピー」を押して、Google Classroom や Google フォームに貼り付け</li>
      </ol>
      <textarea class="copy" id="rt" readonly>${esc(fullText)}</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="cp">📋 記録をコピー</button>
        <button class="btn sub" id="ed">名前を変更</button>
        <span class="grow"></span>
        <button class="btn sub small" id="rs">記録をすべて消す</button>
      </div>
    </div>
    <details class="teacher noprint">
      <summary>先生用：提出された記録の確認</summary>
      <div class="panel" style="margin-top:8px">
        <p class="note" style="margin-top:0">生徒が「記録をコピー」で提出した文章を、下に貼り付けて「確認」を押してください。文章が書きかえられていないかを確認コードで照合します。<br>※簡易的なチェックです。改ざんを完全に防ぐものではありません。</p>
        <textarea class="copy" id="vt" placeholder="ここに提出された記録を貼り付け"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" id="vb">確認</button><span id="vr" style="font-weight:800"></span></div>
      </div>
    </details>`);
  $('#bk').onclick = () => go('home');
  $('#ed').onclick = () => profileModal(false);
  $('#cp').onclick = async () => {
    try { await navigator.clipboard.writeText(fullText); toast('コピーしました。Classroom などに貼り付けてね'); }
    catch (e) { const t = $('#rt'); t.select(); document.execCommand('copy'); toast('コピーしました'); }
  };
  $('#rs').onclick = () => {
    if (!confirm('この端末に保存された学習記録をすべて消します。元に戻せません。よろしいですか？')) return;
    if (!confirm('本当に消しますか？')) return;
    S = blank(); save(); renderHeader(); profileModal(true);
  };
  $('#vb').onclick = () => {
    const t = $('#vt').value.replace(/\r/g, '');
    const m = t.match(/\n?確認コード：\s*([0-9A-F]{4}-[0-9A-F]{4})\s*$/i);
    const vr = $('#vr');
    if (!m) { vr.style.color = 'var(--ng)'; vr.textContent = '確認コードの行が見つかりません'; return; }
    const ok = checkCode(normBody(t.slice(0, m.index))) === m[1].toUpperCase();
    vr.style.color = ok ? 'var(--ok)' : 'var(--ng)';
    vr.textContent = ok ? '✔ 一致しました（書きかえられていません）' : '✖ 一致しません（文章が書きかえられている可能性があります）';
  };
};

// ---------- 起動 ----------
renderHeader();
if (!S.profile) { go('home'); profileModal(true); }
else go('home');
</script>
</body>
</html>
